# ============================================================================
#  Simple Deck - Release CI
#  ----------------------------------------------------------------------------
#  Buduje instalator .exe (Inno Setup) na Windows runner i tworzy GitHub Release.
#
#  Wyzwalacze:
#    1. Push tagu v* (np. v1.3.1)  -> automatyczny build + release
#    2. workflow_dispatch           -> manualny build podanej wersji
#
#  Historia MSI: build.ps1 probowal budowac tez .msi przez WiX Toolset,
#  ale WiX v4+ usunelo subkomende 'heat' z CLI (celowe - monetyzacja przez
#  HeatWave Build Tools). MSI wymagaloby rekompilacji build.ps1 pod nowa
#  skladnie WiX v5+ lub recznego authoring .wxs. Na potrzeby desktop app
#  Inno Setup .exe jest w zupelnej wystarczalnosci.
#
#  Interakcja z lokalnym CLI (scripts/release.py):
#    - Lokalny release.py (--ci) pushuje TYLKO tag; ten workflow buduje
#      i tworzy release w chmurze.
#
#  PODPIS KODU (Azure Artifact Signing, dawniej Trusted Signing):
#    build.ps1 podpisuje pliki aplikacji + instalator, gdy w sekretach repo
#    ustawione są (Settings -> Secrets and variables -> Actions):
#      SIGN_ENDPOINT        - regionalny endpoint konta, np. https://eus.codesigning.azure.net
#      SIGN_ACCOUNT         - nazwa Artifact Signing account
#      SIGN_PROFILE         - nazwa certificate profile (Public Trust)
#      AZURE_TENANT_ID      - Entra tenant (service principal)
#      AZURE_CLIENT_ID      - app (client) ID service principal
#      AZURE_CLIENT_SECRET  - secret service principal
#    Principal musi mieć rolę "Artifact Signing Certificate Profile Signer".
#    Bez sekretów build działa normalnie, ale artefakty są niepodpisane.
# ============================================================================
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja do zbudowania (bez prefixu v, np. 1.1.0)'
        required: true
        default: '1.1.0'
      prerelease:
        description: 'Oznacz release jako pre-release (beta)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # wymagane przez gh release create / upload

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SignTool (Windows SDK BuildTools)
        shell: pwsh
        run: |
          # Podpis (Azure Artifact Signing) wymaga signtool.exe z Windows SDK
          # >= 10.0.2261.755 (dlib nie działa z wersją z VS/Inno). Instalujemy
          # przez nuget.exe do katalogu lokalnego runnera.
          Invoke-WebRequest -Uri https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile nuget.exe -UseBasicParsing
          & .\nuget.exe install Microsoft.Windows.SDK.BuildTools -x -NonInteractive -OutputDirectory "${{ github.workspace }}\sdktools"
          $signtool = Get-ChildItem -Path "${{ github.workspace }}\sdktools" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe nie znaleziony po instalacji SDK BuildTools" }
          $dir = Split-Path -Parent $signtool
          echo $dir >> $env:GITHUB_PATH
          Write-Host "signtool: $signtool"

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          # 'upgrade' is idempotent: installs if missing, no-op if newer present.
          # windows-latest image ships InnoSetup preinstalled (currently 6.7.1).
          choco upgrade innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            # Tag push: usun prefix 'v'
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          Write-Host "Version: $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Build installer (.exe)
        shell: pwsh
        env:
          # Podpis kodu (Azure Artifact Signing) - krok w build.ps1 aktywuje się
          # tylko gdy WSZYSTKIE sekrety są ustawione; inaczej pomijany (unsigned).
          SIGN_ENDPOINT: ${{ secrets.SIGN_ENDPOINT }}
          SIGN_ACCOUNT: ${{ secrets.SIGN_ACCOUNT }}
          SIGN_PROFILE: ${{ secrets.SIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          Set-Location installer\windows
          # -SkipMsi: WiX v4+ nie ma 'heat' CLI; .msi wymagalby rekompilacji build.ps1.
          # Inno Setup .exe jest wystarczajacy dla userskiego desktop app.
          & .\build.ps1 -SkipMsi

      - name: Verify artifacts
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $exe = "installer\windows\output\Simple-Deck-Setup-$v.exe"
          if (-not (Test-Path $exe)) {
            throw "Brak artefaktu: $exe"
          }
          $sz = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "OK: $exe ($sz MB)"

      - name: Verify signatures
        shell: pwsh
        run: |
          # Raport (nie fail): /pa = weryfikacja domyślnym storem Windows.
          # Podpis jest widoczny jako "GREJEM INDUSTRIES" w właściwościach pliku.
          $v = "${{ steps.ver.outputs.version }}"
          $exe = "installer\windows\output\Simple-Deck-Setup-$v.exe"
          if (Test-Path $exe) {
            & signtool verify /pa /v $exe
            if ($LASTEXITCODE -eq 0) { Write-Host "PODPIS OK: $exe" }
            else { Write-Host "BRAK PODPISU / weryfikacja nie przeszła (exit $LASTEXITCODE) - ustaw sekrety SIGN_* aby podpisywać." }
          }

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $v = "${{ steps.ver.outputs.version }}"
          $exe = "installer\windows\output\Simple-Deck-Setup-$v.exe"
          $title = "Simple Deck v$v"

          # Czy release juz istnieje? (np. utworzony przez lokalny release.py)
          $existing = $false
          try {
            gh release view $tag 2>$null
            if ($LASTEXITCODE -eq 0) { $existing = $true }
          } catch { }

          # Pre-release auto-detect: alpha/beta/rc suffix (v1.0.0a, v2.0b2, v1.1.0-rc1)
          # or the manual workflow_dispatch checkbox.
          $isPre = ($v -cmatch '(?i)(a|b|rc)\d*$') -or ("${{ inputs.prerelease }}" -eq "true")
          if ($isPre) { Write-Host "  (oznaczony jako PRE-RELEASE)" }
          if ($existing) {
            Write-Host "Release $tag juz istnieje - upload artefaktow (--clobber)."
            gh release upload $tag $exe --clobber
          } else {
            Write-Host "Tworze nowy release $tag."
            # Argumenty budujemy jako tablica i warunkowo dolaczamy --prerelease.
            # NIE wolno przekazywac pustego stringu jako argumentu (`$preFlag` "")
            # - gh traktuje go jako pozycyjny arg i pada: "no matches found for ''".
            $ghArgs = @("release", "create", $tag, $exe,
                        "--title", $title, "--generate-notes")
            if ($isPre) {
              $ghArgs += "--prerelease"
            }
            gh @ghArgs
          }

          # Wyswietl URL
          gh release view $tag --json url --jq .url
